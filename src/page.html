<html lang="en">

<title>WHAT ARE WE WATCHING</title>

<style>
  :root {
    --night: #07080d;
    --blue: #1537b8;
    --blue-hi: #2a52e0;
    --blue-deep: #0b1d6b;
    --yellow: #ffd21f;
    --yellow-hi: #ffe36a;
    --yellow-lo: #e6ad00;
    --cream: #f3ecd6;
    --vfd: #5ff5d9;
    --sleeve: #0d0e12;
    --sleeve-line: #2a2c36;
    --paper: #f6f0de;
    --paper-2: #d9d3c3;
    --paper-3: #b9b3a5;
    --ink: #121216;
    --red: #d8232f;
    --display: "Archivo", "Arial Narrow", "Helvetica Neue", sans-serif;
    --osd: "VT323", "Courier New", ui-monospace, monospace;
    --tvh: clamp(250px, min(80vw, 46svh), 540px);
    --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { background: var(--night); color: var(--paper); -webkit-text-size-adjust: 100%; }
  body { background: var(--night); color: var(--paper); font-family: var(--display); min-height: 100dvh; }
  ::selection { background: var(--yellow); color: var(--blue-deep); }
  :focus-visible { outline: 3px solid var(--yellow); outline-offset: 3px; }
  button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; -webkit-tap-highlight-color: transparent; }
  .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }
  .nb { white-space: nowrap; }
  svg.icon { width: 1em; height: 1em; flex: none; fill: currentColor; }

  /* ── the stage: the Blender store + set, drawn by three.js ───────────────── */
  .stage-wrap { position: fixed; inset: 0; z-index: 0; background: var(--night); }
  #stage { display: block; width: 100%; height: 100%; opacity: 0; transition: opacity 900ms var(--ease-out); }
  html.tv-ready #stage { opacity: 1; }
  .flat { display: none; }
  html.no-webgl #stage { display: none; }
  html.no-webgl .flat { display: block; position: absolute; inset: 0; }
  #flatPlate { position: absolute; inset: 0; background-color: #0b0d18; }
  /* the flat TV: one Cycles frame of the whole scene (blender/store.py --fallback) —
     store, counter, set — placed so its TV sits in the slot, the live screen on its tube */
  #flatPlate { background-repeat: no-repeat; }
  #flatScreen { position: absolute; border-radius: 7% / 9%; background: #111; }

  /* ── the counter: everything you touch ──────────────────────────────────── */
  .counter { position: relative; z-index: 1; }
  .tv-slot { pointer-events: none; --fit: 0.9; }

  /* play bar: the big yellow key, the VCR count window, the sound key */
  .playbar { display: flex; align-items: stretch; gap: 10px; }
  .btn-main {
    flex: 1 1 auto; min-height: 64px; padding: 0 26px;
    display: inline-flex; align-items: center; justify-content: center; gap: 14px;
    border-radius: 14px;
    color: var(--blue-deep);
    background: linear-gradient(180deg, var(--yellow-hi) 0%, var(--yellow) 42%, var(--yellow-lo) 100%);
    box-shadow:
      inset 0 2px 0 rgba(255,255,255,.65),
      inset 0 -5px 0 rgba(140,90,0,.35),
      0 10px 22px -8px rgba(0,0,0,.85),
      0 2px 4px rgba(0,0,0,.4);
    font-weight: 900; font-style: italic; font-stretch: 115%;
    font-size: 22px; letter-spacing: 0.02em; text-transform: uppercase; white-space: nowrap;
    transition: transform 90ms ease-out, box-shadow 90ms ease-out, filter 150ms ease-out;
  }
  .btn-main .icon { width: 22px; height: 22px; }
  .btn-main:active { transform: translateY(3px); box-shadow: inset 0 2px 0 rgba(255,255,255,.5), inset 0 -2px 0 rgba(140,90,0,.35), 0 4px 10px -6px rgba(0,0,0,.9); }
  .vfd {
    flex: 0 1 190px; min-width: 0; display: flex; align-items: center; justify-content: center;
    padding: 6px 14px; border-radius: 10px;
    background: linear-gradient(180deg, #050807, #0b1210);
    border: 1px solid #1e2624;
    box-shadow: inset 0 2px 8px rgba(0,0,0,.9), 0 1px 0 rgba(255,255,255,.06);
  }
  .count { font-family: var(--osd); font-size: 21px; line-height: 1.05; color: var(--vfd); text-transform: uppercase;
    text-shadow: 0 0 6px rgba(95,245,217,.65), 0 0 16px rgba(95,245,217,.25); text-align: center; }
  .key {
    display: inline-flex; align-items: center; justify-content: center; gap: 8px;
    min-height: 44px; padding: 0 14px; border-radius: 10px;
    color: var(--paper);
    background: linear-gradient(180deg, #34363d, #212328);
    box-shadow: inset 0 1px 0 rgba(255,255,255,.14), inset 0 -3px 0 rgba(0,0,0,.35), 0 6px 14px -6px rgba(0,0,0,.8);
    font-weight: 700; font-stretch: 90%; font-size: 13px; letter-spacing: .06em; text-transform: uppercase;
    transition: transform 90ms ease-out, background 150ms ease-out, color 150ms ease-out;
  }
  .key:active { transform: translateY(2px); }
  .key .icon { width: 18px; height: 18px; }
  .key-sound { flex: none; }
  .key-sound .label { display: none; }
  .key-sound[aria-pressed="false"] { color: var(--paper-3); }
  .key-sound[aria-pressed="false"] .wave { display: none; }
  .key-sound[aria-pressed="true"] .mute { display: none; }

  /* directory: the store's blue sign board */
  .directory {
    border-radius: 16px; padding: 18px 18px 20px;
    background: linear-gradient(180deg, #2147d6 0%, var(--blue) 36%, #102d9c 100%);
    border: 1px solid #0a1f6e;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.28), inset 0 -2px 0 rgba(0,0,0,.25), 0 24px 48px -18px rgba(0,0,0,.85);
    color: #eef2ff;
  }
  .tagline { margin-top: 18px; padding-top: 12px; border-top: 1px dashed rgba(255,210,31,.4);
    font-weight: 800; font-stretch: 80%; font-size: 12px; letter-spacing: .12em; color: var(--yellow); line-height: 1.5; }
  .group + .group { margin-top: 18px; }
  .plaque { font-weight: 900; font-style: italic; font-stretch: 112%; font-size: 15px; letter-spacing: .03em; text-transform: uppercase;
    color: var(--yellow); margin-bottom: 10px; display: flex; align-items: center; gap: 10px; }
  .plaque::after { content: ""; flex: 1; height: 2px; border-radius: 2px; background: linear-gradient(90deg, rgba(255,210,31,.55), rgba(255,210,31,0)); }
  .filter-row { display: flex; gap: 6px; flex-wrap: wrap; }
  .chip {
    min-height: 32px; padding: 6px 11px 7px; border-radius: 7px;
    background: linear-gradient(180deg, #3b63ee 0%, #2649d2 55%, #1d3dbb 100%);
    border: 1px solid #0a2276;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.34), inset 0 -3px 0 rgba(4,16,72,.55), 0 3px 6px -2px rgba(0,0,0,.55);
    color: #f1f4ff; font-weight: 700; font-stretch: 85%; font-size: 13px; letter-spacing: .04em; text-transform: uppercase;
    transition: background 140ms ease-out, color 140ms ease-out, border-color 140ms ease-out, transform 90ms ease-out, box-shadow 90ms ease-out;
  }
  .chip:active { transform: translateY(1px); box-shadow: inset 0 1px 0 rgba(255,255,255,.25), inset 0 -1px 0 rgba(4,16,72,.55), 0 1px 2px rgba(0,0,0,.45); }
  .chip.active {
    transform: translateY(1px);
    background: linear-gradient(180deg, var(--yellow) 0%, var(--yellow-hi) 100%);
    border-color: #a87c00; color: var(--blue-deep);
    box-shadow: inset 0 2px 3px rgba(120,80,0,.45), 0 1px 1px rgba(0,0,0,.35);
  }
  /* decades are fluorescent rental stickers, black ink */
  .sticker { border-radius: 999px; border: 2px solid rgba(255,255,255,.85); color: #111; font-weight: 900; font-stretch: 100%;
    padding: 6px 14px; box-shadow: 0 4px 10px -4px rgba(0,0,0,.6), inset 0 1px 0 rgba(255,255,255,.55);
    background: var(--st); opacity: .78; }
  .sticker.active { opacity: 1; color: #111; background: var(--st); border-color: #111;
    box-shadow: 0 0 0 3px var(--yellow), 0 4px 10px -4px rgba(0,0,0,.6); }
  .sticker-1970 { --st: #ff8a2a; transform: rotate(-2deg); }
  .sticker-1980 { --st: #ff5fa2; transform: rotate(1.5deg); }
  .sticker-1990 { --st: #2fd0c4; transform: rotate(-1deg); }
  .sticker-2000 { --st: #b6e14a; transform: rotate(2deg); }
  .sticker-2010 { --st: #b49cff; transform: rotate(-1.5deg); }
  .sticker-2020 { --st: #ff6a5f; transform: rotate(1deg); }
  .sticker:active { transform: translateY(1px); }
  .genre-toggle { display: none; }
  .genre-toggle .icon { width: 14px; height: 14px; transition: transform 160ms ease-out; }
  .genre-toggle.is-open .icon { transform: rotate(180deg); }
  .genre-toggle.on { border-color: var(--yellow); color: var(--yellow); }

  .actor-row { display: flex; gap: 8px; align-items: stretch; flex-wrap: wrap; }
  .actor-row .key { flex: 1; }
  .actor-input {
    flex: 1 1 100%; min-width: 0; min-height: 44px; padding: 10px 12px; border-radius: 8px;
    background: var(--cream); color: var(--ink); caret-color: var(--blue);
    border: 1px solid #c9bf9f; box-shadow: inset 0 2px 4px rgba(0,0,0,.18);
    font-family: var(--display); font-weight: 600; font-size: 16px; outline: none;
  }
  .actor-input::placeholder { color: #6b6457; font-weight: 500; }
  .actor-input:focus-visible { outline: 3px solid var(--yellow); outline-offset: 2px; }
  #clearBtn { padding: 0 12px; flex: 0 0 52px; }

  /* the sleeve: the back of the rental box */
  .card {
    display: none; position: relative; overflow: hidden;
    border-radius: 12px; padding: 18px 18px 18px 30px;       /* the hinge side of the case is wider */
    background: #16171b url(assets/clamshell.jpg?v=__ASSET_V__) center / cover;
    box-shadow: inset 0 1px 0 rgba(255,255,255,.12), inset 0 0 0 1px rgba(0,0,0,.65), 0 30px 60px -22px rgba(0,0,0,.9);
  }
  .card.show { display: block; }
  .sleeve-body {
    position: relative; border-radius: 4px; padding: 20px 18px 20px calc(7.5% + 16px);   /* clear the printed spine strip */
    background: #1b1d27 url(assets/insert.jpg?v=__ASSET_V__) left top / 100% auto repeat-y;
    box-shadow: 0 0 0 1px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.55);
    transition: opacity 340ms ease-out, transform 460ms var(--ease-out), filter 340ms ease-out;
  }
  .card::before { content: ""; position: absolute; left: 12px; top: 18px; bottom: 18px; width: 3px; border-radius: 2px;
    background: linear-gradient(90deg, rgba(0,0,0,.7), rgba(255,255,255,.12)); pointer-events: none; }
  /* the clear vinyl sleeve over the printed insert */
  .sleeve-body::after { content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
    background: linear-gradient(115deg, rgba(255,255,255,0) 34%, rgba(255,255,255,.07) 45%, rgba(255,255,255,0) 56%); }
  .card.tuning .sleeve-body { opacity: 0; transform: translateY(8px); filter: blur(2px); }
  .rewind { position: absolute; top: 18px; right: 18px; z-index: 2; width: 66px; height: 66px; border-radius: 50%;
    display: grid; place-items: center; text-align: center; transform: rotate(9deg);
    background: radial-gradient(circle at 35% 30%, #ff4a52, var(--red) 60%, #a4121c);
    box-shadow: 0 4px 10px -3px rgba(0,0,0,.7), inset 0 0 0 2px rgba(255,255,255,.75);
    color: #fff; font-weight: 900; font-stretch: 75%; font-size: 10.5px; line-height: 1.05; letter-spacing: .05em; pointer-events: none; }
  .card-main { display: flex; gap: 18px; align-items: flex-start; }
  .card-poster { width: 132px; flex-shrink: 0; display: block; border-radius: 3px; background: #1a1b22;
    box-shadow: 0 10px 22px -8px rgba(0,0,0,.9), 0 0 0 1px rgba(255,255,255,.1); aspect-ratio: 2 / 3; object-fit: cover; }
  .card-poster.hidden { display: none; }
  .card-body { flex: 1; min-width: 0; }
  .card-head { flex: 1; min-width: 0; padding-right: 58px; }
  .actor-note { font-weight: 800; font-stretch: 80%; font-size: 13px; line-height: 1.3; letter-spacing: .06em; text-transform: uppercase;
    color: var(--yellow); margin-bottom: 10px; padding-right: 64px; }
  .card-title { font-weight: 900; font-stretch: 68%; font-size: clamp(32px, 2.9vw, 50px); line-height: .94; text-transform: uppercase;
    letter-spacing: -0.005em; color: var(--paper); overflow-wrap: break-word; text-wrap: balance; }
  .card-year { font-weight: 700; font-stretch: 75%; font-size: 16px; line-height: 1.3; letter-spacing: .06em; text-transform: uppercase;
    color: var(--yellow); margin-top: 10px; text-wrap: balance; }
  .card-desc { font-stretch: 92%; font-size: 16px; line-height: 1.6; color: var(--paper-2); margin-top: 18px; max-width: 62ch; }
  .card-tags { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 16px; }
  .tag { border: 1.5px solid rgba(246,240,222,.5); color: var(--paper); padding: 3px 8px 2px; border-radius: 3px;
    font-weight: 800; font-stretch: 80%; font-size: 11px; letter-spacing: .1em; text-transform: uppercase; }
  .card-cast { margin-top: 16px; padding-top: 12px; border-top: 1px solid var(--sleeve-line);
    font-weight: 600; font-stretch: 70%; font-size: 14px; line-height: 1.45; letter-spacing: .05em; text-transform: uppercase; color: var(--paper-3); }
  .billing-lead { color: var(--yellow); font-weight: 800; }
  .card-streaming { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 12px; }
  .card-streaming:empty { display: none; }
  .streaming-logo { font-weight: 800; font-size: 11px; letter-spacing: .08em; padding: 3px 7px; border-radius: 3px; background: #22242c; color: var(--paper-2); }
  .card-watch { margin-top: 18px; }
  .btn-watch {
    display: inline-flex; align-items: center; gap: 10px; min-height: 44px; padding: 0 16px; border-radius: 8px;
    text-decoration: none; color: var(--blue-deep);
    background: linear-gradient(180deg, var(--yellow-hi), var(--yellow) 50%, var(--yellow-lo));
    box-shadow: inset 0 1px 0 rgba(255,255,255,.6), inset 0 -3px 0 rgba(140,90,0,.3), 0 8px 16px -8px rgba(0,0,0,.8);
    font-weight: 900; font-stretch: 105%; font-size: 14px; letter-spacing: .06em; text-transform: uppercase;
  }
  .btn-watch .icon { width: 16px; height: 16px; }

  @media (hover: hover) {
    .btn-main:hover { filter: brightness(1.06) saturate(1.05); }
    .chip:hover { border-color: var(--yellow); }
    .chip.active:hover { border-color: var(--yellow-lo); }
    .key:hover { color: var(--yellow); }
    .btn-watch:hover { filter: brightness(1.06); }
  }

  /* ── desktop: sign board | TV on the counter | the sleeve ───────────────── */
  @media (min-width: 1080px) and (min-aspect-ratio: 5/4) {
    body { overflow: hidden; height: 100dvh; }
    .counter {
      position: fixed; inset: 0;
      display: grid;
      grid-template-columns: clamp(300px, 24vw, 400px) minmax(0, 1fr) clamp(330px, 27vw, 460px);
      grid-template-rows: minmax(0, 1fr) auto;
      grid-template-areas: "dir slot card" "dir play card";
      gap: 22px 30px;
      padding: 28px 32px 30px;
    }
    .directory { grid-area: dir; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,210,31,.45) transparent; align-self: start; max-height: 100%; }
    .tv-slot { grid-area: slot; }
    .playbar { grid-area: play; justify-self: center; width: min(100%, 560px); }
    .card { grid-area: card; align-self: center; max-height: 100%; overflow-y: auto; scrollbar-width: thin; scrollbar-color: rgba(255,255,255,.2) transparent; }
    .card-main { flex-direction: column; }
    /* poster, then the title at the card's full width: a long title wraps at words, never clips */
    .card-top { display: flex; flex-direction: column; gap: 14px; align-items: flex-start; }
    .card-head { padding-right: 0; }
    .card-poster { width: 112px; }
    .card-title { font-size: clamp(30px, 2.5vw, 46px); }
    /* the board holds 42 genres: keep it to one screen at 900 px tall */
    .directory { padding: 16px 16px 18px; }
    .tagline { margin-top: 14px; }
    .group + .group { margin-top: 14px; }
    .plaque { margin-bottom: 8px; }
    .filter-row { gap: 5px; }
    .chip { min-height: 29px; padding: 5px 9px; font-size: 12.5px; }
    .sticker { padding: 5px 12px; }
  }
  @media (min-width: 1600px) and (min-aspect-ratio: 5/4) {
    .playbar { width: min(100%, 640px); }
    .tv-slot { --fit: 0.8; }          /* a wide screen shows more store: the neon clears the top edge */
    .chip { min-height: 32px; padding: 6px 11px; font-size: 13px; }
    .counter { padding: 40px 48px 40px; gap: 26px 44px; }
    .btn-main { min-height: 72px; font-size: 25px; }
    .card-poster { width: 140px; }
    .card-desc { font-size: 17px; }
  }

  /* ── stacked: phones, tablets, anything tall — the TV stays up top ─────── */
  @media not ((min-width: 1080px) and (min-aspect-ratio: 5/4)) {
    :root { --tvh: clamp(280px, min(96vw, 50svh), 580px); }
    /* below the TV is the counter's blue front, under an aluminium edge, not a seam */
    html, body { background: #0b2372; }
    body { background: linear-gradient(180deg, #102f93 0, #0d2982 40vh, #0a2066 100%) fixed; }
    .stage-wrap { bottom: auto; height: var(--tvh); z-index: 3; }
    .stage-wrap::after { content: ""; position: absolute; left: 0; right: 0; bottom: -9px; height: 9px;
      background: linear-gradient(180deg, #e2e4e7 0, #a9adb3 40%, #6d7178 100%);
      box-shadow: 0 8px 16px -4px rgba(0,0,0,.6); }
    .tv-slot { position: fixed; top: calc(var(--tvh) * 0.17); left: 12px; right: 12px; height: calc(var(--tvh) * 0.83 - 6px); z-index: -1; --fit: 0.9; }
    .counter {
      display: flex; flex-direction: column; gap: 16px;
      padding: calc(var(--tvh) + 26px) max(14px, env(safe-area-inset-right)) calc(28px + env(safe-area-inset-bottom)) max(14px, env(safe-area-inset-left));
      max-width: 720px; margin: 0 auto;
    }
    .card-top { display: contents; }
    .card-main { gap: 16px; }
    .card-poster { width: 118px; }
  }
  @media (max-width: 620px) {
    .playbar { flex-wrap: wrap; }
    .btn-main { min-height: 60px; font-size: 20px; padding: 0 18px; flex: 1 1 0; }
    .key-sound { min-width: 60px; }
    .vfd { order: 3; flex: 1 1 100%; min-height: 44px; }
    .count { font-size: 19px; white-space: nowrap; }
    .directory { padding: 16px 14px 18px; }
    .plaque-genres { display: none; }
    .genre-toggle { display: inline-flex; align-items: center; gap: 8px; margin-bottom: 10px; min-height: 44px; padding: 10px 15px; font-size: 14px; }
    #genres { display: none; }
    #genres.open { display: flex; align-content: flex-start; max-height: 44vh; overflow-y: auto;
      border: 1px solid rgba(255,255,255,.2); border-radius: 10px; padding: 10px; }
    .chip { font-size: 14px; min-height: 44px; padding: 10px 14px; }
    .actor-row { flex-wrap: wrap; }
    .actor-input { flex: 1 1 100%; }
    .actor-row .key { flex: 1; }
    #clearBtn { flex: 0 0 56px; }
    .card { padding: 12px 12px 12px 22px; }
    .card::before { left: 8px; top: 12px; bottom: 12px; }
    .sleeve-body { padding: 18px 14px 18px calc(7.5% + 12px); }
    .card-main { flex-direction: column; }
    .card-poster { width: 108px; }
    .card-title { font-size: 34px; }
  }

  @media (prefers-reduced-motion: reduce) {
    #stage, .sleeve-body, .btn-main, .chip, .key { transition: none; }
    .card.tuning .sleeve-body { filter: none; transform: none; }
  }
</style>
</head>
<body>
<!--
  THESIS: the chooser is a tube TV on a rental-store counter at night; a pick is a channel change — half a second of snow or torn bars, then the film plays like a tape. Refuses the dark app card on a flat page.
  OWN-WORLD: Blender-built silver 70s portable on a 90s VCR, three.js-lit in front of a Cycles store plate (face-out tapes, blue headers, pink neon). Rental-store blue, sticker yellow, fluorescent decade stickers, VFD cyan. VT323 only on the tube and VCR; Archivo in two voices — wide black italic for signage (keys, plaques: 90s retail sign lettering), condensed caps for the sleeve's print. Chunky plastic keys; the sleeve is a pebbled clamshell over a printed insert. No glass.
  STORY: open → the TV shows WHAT ARE WE WATCHING on VCR blue; press SURPRISE ME → snow + shh → a film plays; the sleeve back gives the words and where to watch.
  FIRST VIEWPORT: desktop — sign board left, TV centre on the counter with the yellow key under it, sleeve right. Phone — TV pinned across the top, yellow key directly below.
  FORM: pinned by the owner 2026-09-27 — "Blockbuster movie rental store vibe", "CRT Tube look", "WhatAreWeWatching within the TV", "Pre-Frutiger Aero or earlier", plus his photos (silver portable TV; snow with CH 03; torn colour bars). A pinned brief beats the roll: no seed key; code-led.
  FINISH: unreviewed and undocumented is unfinished; this build ends with the finish review, the verdict, DESIGN.md, and every shipping raster carrying its provenance
-->
<h1 class="sr-only">What Are We Watching</h1>

<div class="stage-wrap">
  <canvas id="stage" aria-hidden="true"></canvas>
  <div class="flat" aria-hidden="true"><div id="flatPlate"></div><canvas id="flatScreen"></canvas></div>
</div>

<main class="counter">
  <div class="tv-slot" id="tvSlot" aria-hidden="true"></div>

  <section class="playbar" aria-label="Pick a film">
    <button class="btn-main" id="surpriseBtn" type="button">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 3.5v17a1 1 0 0 0 1.52.85l13.2-8.5a1 1 0 0 0 0-1.7L7.52 2.65A1 1 0 0 0 6 3.5z"/></svg>
      Surprise me
    </button>
    <div class="vfd"><span class="count" id="countLine" aria-live="polite"></span></div>
    <button class="key key-sound" id="soundBtn" type="button" aria-pressed="true" aria-label="Channel-change sound">
      <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9h4l5-4v14l-5-4H4a1 1 0 0 1-1-1v-4a1 1 0 0 1 1-1z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/><path class="mute" d="M16.5 9.5l5 5m0-5l-5 5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <span class="label">SOUND ON</span>
    </button>
  </section>

  <article class="card" id="card" aria-live="polite" aria-label="The tape you picked">
    <div class="rewind" aria-hidden="true">BE KIND<br>PLEASE<br>REWIND</div>
    <div class="sleeve-body">
      <div class="actor-note" id="actorNote" style="display:none"></div>
      <div class="card-main">
        <div class="card-top">
          <img class="card-poster hidden" id="cardPoster" alt="" crossorigin="anonymous">
          <div class="card-head">
            <h2 class="card-title" id="cardTitle"></h2>
            <div class="card-year" id="cardYear"></div>
          </div>
        </div>
        <div class="card-body">
          <p class="card-desc" id="cardDesc"></p>
          <div class="card-tags" id="cardTags"></div>
          <div class="card-cast" id="cardCast"></div>
          <div class="card-streaming" id="cardStreaming"></div>
          <div class="card-watch" id="cardWatch"><a class="btn-watch" id="watchLink" href="#" target="_blank" rel="noopener">Where to watch<svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 11h11.6l-4.3-4.3 1.4-1.4L20.4 12l-6.7 6.7-1.4-1.4 4.3-4.3H5z"/></svg></a></div>
        </div>
      </div>
    </div>
  </article>

  <section class="directory" aria-label="Filters">
    <div class="group">
      <h2 class="plaque plaque-genres">Genres</h2>
      <button class="chip genre-toggle" id="genreToggle" type="button" aria-expanded="false" aria-controls="genres"><span class="label">GENRES</span><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5.3 8.3 12 15l6.7-6.7 1.4 1.4L12 17.8 3.9 9.7z"/></svg></button>
      <div class="filter-row" id="genres"></div>
    </div>
    <div class="group">
      <h2 class="plaque">Decade</h2>
      <div class="filter-row" id="decades"></div>
    </div>
    <div class="group">
      <h2 class="plaque">First film</h2>
      <div class="actor-row">
        <input class="actor-input" id="actorInput" aria-label="Actor name" placeholder="actor name → their first film in the list" autocomplete="off" spellcheck="false">
        <button class="key" id="actorBtn" type="button">First film</button>
        <button class="key" id="clearBtn" type="button" aria-label="Clear actor search"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6.4 5 12 10.6 17.6 5 19 6.4 13.4 12l5.6 5.6-1.4 1.4-5.6-5.6L6.4 19 5 17.6l5.6-5.6L5 6.4z"/></svg></button>
      </div>
    </div>
    <p class="tagline">CLASSICS · CULT · DOCS · FRINGE · SPACE · <span class="nb"><span id="total"></span> FILMS</span></p>
  </section>
</main>

<script>
/*@FILMS@*/
/*@APP@*/
</script>
<script>
/*@SCENE@*/
</script>
</body>
</html>
